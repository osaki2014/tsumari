<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ことばをひらく</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root{
    --bg:#f6f6f3;
    --ink:#111;
    --paper:#fff;
    --line:#111;
    --muted:#777;
    --blue:#2563eb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",
    "Yu Gothic",Meiryo,sans-serif;
    overflow-x:hidden;
  }

  /* 最小限のヘッダー */
  header{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:rgba(246,246,243,.94);
    border-bottom:1px solid #ddd;
    position:sticky;
    top:0;
    z-index:50;
    backdrop-filter:blur(10px);
  }
  .brand{
    font-size:17px;
    font-weight:800;
    letter-spacing:-.02em;
  }
  .brand-wrap{display:flex;align-items:center;gap:9px}
  .qr-icon-btn{
    width:34px;height:34px;border:1.5px solid #111;border-radius:10px;
    background:#fff;display:grid;place-items:center;padding:6px;cursor:pointer;
  }
  .qr-icon-btn:hover{background:#111}
  .qr-icon-btn:hover svg{stroke:#fff;fill:#fff}
  .qr-icon-btn svg{width:100%;height:100%;stroke:#111;fill:#111;stroke-width:1.5}
  .header-actions{display:flex;align-items:center;gap:8px}
  .icon-btn,.capture-btn{
    border:1.5px solid #111;
    background:#fff;
    color:#111;
    border-radius:999px;
    height:36px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-weight:800;
  }
  .icon-btn{width:36px;font-size:17px}
  .capture-btn{padding:0 15px;font-size:13px}
  .capture-btn:hover,.icon-btn:hover{background:#111;color:#fff}

  /* メインはほぼキャプチャだけ */
  main{padding:14px}
  .workspace{
    width:min(1500px,100%);
    height:calc(100vh - 86px);
    min-height:520px;
    margin:0 auto;
    background:#161616;
    border-radius:18px;
    overflow:hidden;
    position:relative;
    box-shadow:0 12px 36px rgba(0,0,0,.10);
  }
  #screenCanvas{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
    cursor:crosshair;
    touch-action:none;
  }
  .empty{
    position:absolute;inset:0;
    display:grid;place-items:center;
    color:#ddd;
    text-align:center;
    line-height:1.9;
    padding:30px;
    pointer-events:none;
  }
  .empty strong{color:#fff;font-size:18px}
  .hint{
    position:absolute;
    left:14px;bottom:14px;
    background:rgba(0,0,0,.72);
    color:#fff;
    border-radius:999px;
    padding:8px 12px;
    font-size:12px;
    pointer-events:none;
  }
  .hidden{display:none!important}

  /* 漫画吹き出し */
  .bubble{
    position:absolute;
    z-index:20;
    width:min(430px,calc(100% - 28px));
    height:min(360px,calc(100% - 28px));
    min-width:300px;
    min-height:190px;
    max-width:calc(100% - 16px);
    max-height:calc(100% - 16px);
    background:transparent;
    color:#111;
    padding:8px 14px 16px;
    opacity:0;
    transform:translateY(10px) scale(.97);
    transition:opacity .2s ease, transform .25s cubic-bezier(.2,.8,.2,1),
               left .18s ease, top .18s ease;
    display:flex;
    flex-direction:column;
    overflow:visible;
  }
  .bubble.show{opacity:1;transform:translateY(0) scale(1)}
  .bubble.dragging,.bubble.resizing{transition:none!important}

  .bubble-shape-layer{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    overflow:visible;
    pointer-events:none;
  }
  .bubble-shape{
    fill:#fff;
    stroke:#111;
    stroke-width:2;
    stroke-linejoin:round;
    stroke-linecap:round;
    vector-effect:non-scaling-stroke;
    filter:drop-shadow(8px 9px 0 rgba(0,0,0,.22));
  }

  .bubble-drag-handle{
    position:relative;
    z-index:2;
    flex:0 0 12px;
    height:12px;
    display:grid;
    place-items:center;
    cursor:grab;
    touch-action:none;
    margin:-2px 0 3px;
  }
  .bubble-drag-handle:active{cursor:grabbing}
  .bubble-drag-handle::before{
    content:"";
    width:42px;
    height:4px;
    border-radius:999px;
    background:#d4d4d4;
  }

  .bubble-resize-right{
    position:absolute;
    top:26px;
    right:-4px;
    width:10px;
    bottom:24px;
    cursor:ew-resize;
    touch-action:none;
    z-index:4;
  }
  .bubble-resize-bottom{
    position:absolute;
    left:26px;
    right:24px;
    bottom:-4px;
    height:10px;
    cursor:ns-resize;
    touch-action:none;
    z-index:4;
  }

  .bubble-resize-handle{
    position:absolute;
    right:5px;
    bottom:5px;
    width:19px;
    height:19px;
    cursor:nwse-resize;
    touch-action:none;
    z-index:3;
    opacity:.55;
  }
  .bubble-resize-handle::before,
  .bubble-resize-handle::after{
    content:"";
    position:absolute;
    right:1px;
    bottom:1px;
    width:12px;
    height:2px;
    background:#777;
    transform-origin:right center;
    transform:rotate(-45deg);
    border-radius:2px;
  }
  .bubble-resize-handle::after{
    width:7px;
    right:1px;
    bottom:6px;
  }

  .bubble-toolbar{
    position:relative;
    z-index:2;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    padding-bottom:10px;
    margin-bottom:10px;
    border-bottom:1px solid #ddd;
    flex:0 0 auto;
  }
  .word-btn{
    appearance:none;
    background:#fff;
    color:#111;
    border:1.5px solid #111;
    border-radius:999px;
    padding:7px 10px;
    font:inherit;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    white-space:nowrap;
    transition:transform .12s ease,background .12s ease,color .12s ease;
  }
  .word-btn:hover:not(:disabled){background:#111;color:#fff;transform:translateY(-1px)}
  .word-btn:disabled{opacity:.35;cursor:not-allowed}


  .bubble-toolbar .word-btn:nth-child(5){
    margin-left:4px;
  }
  .bubble-body{
    position:relative;
    z-index:2;
    overflow:auto;
    scrollbar-width:thin;
    flex:1 1 auto;
    min-height:0;
    padding-right:3px;
  }
  .bubble-text{
    font-size:17px;
    line-height:1.8;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    min-height:48px;
  }
  .bubble-text.swap-out{animation:swapOut .18s ease forwards}
  .bubble-text.swap-in{animation:swapIn .34s cubic-bezier(.2,.8,.2,1) both}
  @keyframes swapOut{
    to{opacity:0;transform:translateY(-7px);filter:blur(4px)}
  }
  @keyframes swapIn{
    from{opacity:0;transform:translateY(9px);filter:blur(4px)}
    to{opacity:1;transform:none;filter:none}
  }
  .loading-row{
    display:inline-flex;align-items:center;gap:8px;color:#555;font-size:14px
  }
  .spinner{
    width:15px;height:15px;border-radius:50%;
    border:2px solid #ccc;border-top-color:#111;
    animation:spin .75s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* QRコードポップアップ */
  .qr-modal-back{
    position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:110;
    display:grid;place-items:center;padding:20px;
  }
  .qr-modal{
    position:relative;background:#fff;border:2px solid #111;border-radius:24px;
    box-shadow:10px 12px 0 rgba(0,0,0,.22);padding:24px 24px 18px;
    width:min(520px,92vw);text-align:center;
  }
  .qr-large{display:block;width:min(420px,78vw);height:auto;margin:0 auto}
  .qr-url{margin-top:12px;font-size:14px;font-weight:800;word-break:break-all}
  .qr-close{
    position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;
    border:1.5px solid #111;background:#fff;font-size:20px;cursor:pointer;z-index:2;
  }

  /* 設定モーダル */
  .modal-back{
    position:fixed;inset:0;
    background:rgba(0,0,0,.28);
    z-index:100;
    display:grid;
    place-items:center;
    padding:18px;
  }
  .modal{
    width:min(520px,100%);
    max-height:90vh;
    overflow:auto;
    background:#fff;
    border:2px solid #111;
    border-radius:22px;
    box-shadow:10px 12px 0 rgba(0,0,0,.22);
    padding:18px;
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-bottom:16px;
  }
  .modal h2{margin:0;font-size:19px}
  .close-btn{
    width:32px;height:32px;border:1.5px solid #111;border-radius:50%;
    background:#fff;font-size:18px;cursor:pointer
  }
  .field{margin:13px 0}
  .field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}
  .field input,.field select{
    width:100%;
    padding:11px 12px;
    border:1.5px solid #111;
    border-radius:10px;
    font:inherit;
    background:#fff;
  }
  .key-wrap{display:flex;gap:7px}
  .key-wrap input{flex:1}
  .mini-btn{
    border:1.5px solid #111;background:#fff;border-radius:10px;
    padding:0 12px;font-weight:800;cursor:pointer
  }
  .save-btn{
    width:100%;border:0;background:#111;color:#fff;
    border-radius:12px;padding:12px;font:inherit;font-weight:800;cursor:pointer
  }
  .test{
    font-size:12px;min-height:18px;margin-top:8px;color:#555
  }
  .help{
    margin-top:17px;padding-top:15px;border-top:1px solid #ddd;
    font-size:13px;line-height:1.75;color:#444
  }
  .help ol{padding-left:20px;margin:8px 0}
  .help a{color:#111;font-weight:800}
  .warning{
    margin-top:12px;
    padding:10px 11px;
    border:1px solid #bbb;
    border-radius:11px;
    background:#f7f7f5;
    font-size:11px;
    line-height:1.65;
    color:#555;
  }
  .status-dot{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    background:#bbb;margin-right:5px
  }
  .status-dot.ok{background:#16835d}
  .free-note{
    margin:10px 0 0;
    padding:10px 11px;
    border:1.5px solid #111;
    border-radius:12px;
    background:#f7fff9;
    font-size:12px;
    line-height:1.65;
  }

  @media(max-width:760px){
    main{padding:8px}
    .workspace{height:calc(100vh - 74px);border-radius:12px}
    .bubble{width:min(360px,calc(100% - 18px));height:min(340px,calc(100% - 18px));padding:8px 11px 14px}
    .bubble-text{font-size:15px}
    .word-btn{font-size:11px;padding:6px 8px}
  }
</style>
</head>
<body>
<header>
  <div class="brand-wrap">
    <button id="qrBtn" class="qr-icon-btn" aria-label="QRコードを表示" title="このサイトのQRコードを表示">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2" y="2" width="7" height="7" rx="1"></rect>
        <rect x="15" y="2" width="7" height="7" rx="1"></rect>
        <rect x="2" y="15" width="7" height="7" rx="1"></rect>
        <path d="M15 15h3v3h-3zM19 15h3v3h-3zM15 19h3v3h-3zM20 20h2v2h-2z"></path>
      </svg>
    </button>
    <div class="brand">ことばをひらく</div>
  </div>
  <div class="header-actions">
    <button id="captureBtn" class="capture-btn" title="共有画面を選んだ後このアプリへ戻ります。選択範囲の文章・数式・図をAIが画像からも読み取ります">画面を取り込む</button>
    <button id="settingsBtn" class="icon-btn" aria-label="設定" title="設定">⚙</button>
  </div>
</header>

<main>
  <section id="workspace" class="workspace">
    <canvas id="screenCanvas"></canvas>
    <div id="empty" class="empty">
      <div><strong>画面を取り込む</strong><br>画面・ウィンドウ・タブを選び、文章をドラッグで囲んでください。</div>
    </div>
    <div id="hint" class="hint hidden">文章のある場所をドラッグ</div>

    <div id="bubble" class="bubble hidden">
      <svg id="bubbleShapeLayer" class="bubble-shape-layer" aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path id="bubbleShapePath" class="bubble-shape" d=""></path>
      </svg>
      <div id="bubbleDragHandle" class="bubble-drag-handle" title="ドラッグして吹き出しを移動"></div>
      <div class="bubble-toolbar">
        <button class="word-btn" data-action="explain">ということは</button>
        <button class="word-btn" data-action="analogy">いいかえると</button>
        <button class="word-btn" data-action="summary">つまり</button>
        <button class="word-btn" data-action="verify">ほんとうに？</button>
        <button class="word-btn" data-action="understood">わかった</button>
        <button class="word-btn" data-action="confused">わからん</button>
      </div>
      <div class="bubble-body">
        <div id="bubbleText" class="bubble-text"></div>
      </div>
      <div id="bubbleResizeRight" class="bubble-resize-right" title="右端をドラッグして幅を変更"></div>
      <div id="bubbleResizeBottom" class="bubble-resize-bottom" title="下端をドラッグして高さを変更"></div>
      <div id="bubbleResizeHandle" class="bubble-resize-handle" title="右下をドラッグして大きさを変更"></div>
    </div>
  </section>
</main>

<div id="qrModal" class="qr-modal-back hidden" role="dialog" aria-modal="true">
  <div class="qr-modal">
    <button id="closeQr" class="qr-close" aria-label="閉じる">×</button>
    <img class="qr-large" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAV4AAAFeAQAAAADlUEq3AAACUUlEQVR4nO2bTY7bMAyFP9YGZqkAPcAcRblaj9Qb2EfpAQaQlwNYeF1I8k/QxUwGSVWUXBhO9C0e8MCQhBgTH4787eMsOOywww7/L3C2GpdcHsyXdj63s8fLcPgLsCRJE4OAQcSUDRYzCJKk9SkyHL4fnmuWIaVsdmWQ2atEydDLk2Q4/FU4m12XF+nHJZumZfxLMhz+RNyapPl1xeBFENLTZDh8N1wdjG0stJjyCOHNAEOU2pgfLMPhu2G2NgUIK5puHkeuE80On0LHWCEmqm9R681pJ5odPoVUjFo331RHivpg89Id7BE+OEhsQ6GUoIyC05HrRLPDp6h1MEj1Y6qZpymse/q5g73CpdKV13h421OSWhvdwT7hVgJL8ykR06Dm4NbJpME7mV7hzUFpt6weBenMdaLZ4VPsg0QbAIeSdCURi43B62C38HGaUOI4DwIQU21N3cFO4XaxtKVafZNa/+J1sG/4ME20KbBl414HvRftGD5c7mpi/wEdznnpdbBbeHOwDvOlF41trAe8DvYNj0AuV0wGw+ksvI1ANuK0jo+V4fDdsJ32RfMIDKttXwjyuD060ezwLbzvqgExZSu/pxPAfAHfk+kZ3ubBOlLsjc02x+N18B+A665aNmYbsWt4N+KvETMbsWu9KexLs8PA7abTUPabxDIiFhDL9xV4Nz1UhsN3w7e7ahZT6UpXg2GFsLI1Np1odvgP8H41yDKiKbwbMbUl/JieJMPhz8PbKAgQ8sh8GTBCO48/X1SzsRvNDh/D/P+DDjvssMNfgH8D1ZTvq27/lP8AAAAASUVORK5CYII=" alt="https://osaki2014.github.io/tsumari/ のQRコード">
    <div class="qr-url">https://osaki2014.github.io/tsumari/</div>
  </div>
</div>

<div id="settingsModal" class="modal-back hidden" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-head">
      <h2 id="settingsTitle">AI 設定</h2>
      <button id="closeSettings" class="close-btn" aria-label="閉じる">×</button>
    </div>

    <div class="field">
      <label for="provider">AI</label>
      <select id="provider">
        <option value="chromeai">Chrome内蔵AI（無料・APIキー不要）</option>
        <option value="gemini-free">Gemini無料枠（2.5 Flash-Lite）</option>
        <option value="gemini">Gemini（通常）</option>
        <option value="openai">OpenAI</option>
      </select>
    </div>

    <div class="field">
      <label id="apiKeyLabel" for="apiKey">Gemini API Key</label>
      <div class="key-wrap">
        <input id="apiKey" type="password" autocomplete="off" placeholder="Google AI Studio のキーを貼り付け">
        <button id="toggleKey" class="mini-btn" type="button">表示</button>
      </div>
    </div>

    <div class="field">
      <label for="model">モデル</label>
      <select id="model"></select>
    </div>

    <div id="searchGroundingField" class="field">
      <label>「ほんとうに？」のWeb確認</label>
      <label style="display:flex;align-items:flex-start;gap:8px;font-weight:500;line-height:1.5">
        <input id="useSearchGrounding" type="checkbox" style="width:auto;margin-top:3px">
        <span>Google検索も使う <small style="display:block;color:#777;margin-top:3px">Geminiの有料API枠向けです。無料枠ではOFFのまま使ってください。</small></span>
      </label>
    </div>

    <button id="saveSettings" class="save-btn">このタブで使う・接続テスト</button>
    <div id="settingsState" class="test"></div>

    <div class="help">
      <b>やりとりの記録</b>
      <div class="free-note">
        OCRした文章、押したボタン、AIへの入力、AIの返答、時刻、AI設定をこのタブ内で記録します。
      </div>
      <div style="height:8px"></div>
      <button id="downloadCsv" class="save-btn" type="button">履歴をCSVで保存</button>
      <div id="historyCount" class="test">履歴 0件</div>
    </div>

    <div id="providerHelp" class="help"></div>

    <div class="warning">
      <b>キーはこのHTMLやGitHubには保存しません。</b><br>
      入力したキーは、このページを開いている間だけブラウザのメモリに保持します。
      再読み込みすると消えます。公開サービスで多数の人に使わせる場合は、
      APIキーをブラウザに置かず、サーバー側へ移す構成を推奨します。
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];

  const workspace = $('#workspace');
  const canvas = $('#screenCanvas');
  const ctx = canvas.getContext('2d');
  const empty = $('#empty');
  const hint = $('#hint');
  const captureBtn = $('#captureBtn');

  const bubble = $('#bubble');
  const bubbleText = $('#bubbleText');
  const actionButtons = $$('.word-btn');
  const bubbleDragHandle = $('#bubbleDragHandle');
  const bubbleResizeHandle = $('#bubbleResizeHandle');
  const bubbleResizeRight = $('#bubbleResizeRight');
  const bubbleResizeBottom = $('#bubbleResizeBottom');
  const bubbleShapeLayer = $('#bubbleShapeLayer');
  const bubbleShapePath = $('#bubbleShapePath');

  const qrBtn = $('#qrBtn');
  const qrModal = $('#qrModal');
  const closeQr = $('#closeQr');

  const settingsBtn = $('#settingsBtn');
  const modal = $('#settingsModal');
  const closeSettings = $('#closeSettings');
  const providerSelect = $('#provider');
  const settingsTitle = $('#settingsTitle');
  const apiKeyLabel = $('#apiKeyLabel');
  const apiKeyInput = $('#apiKey');
  const modelSelect = $('#model');
  const saveSettings = $('#saveSettings');
  const settingsState = $('#settingsState');
  const toggleKey = $('#toggleKey');
  const providerHelp = $('#providerHelp');
  const searchGroundingField = $('#searchGroundingField');
  const useSearchGrounding = $('#useSearchGrounding');
  const downloadCsv = $('#downloadCsv');
  const historyCount = $('#historyCount');

  let baseImage = null;
  let dragging = false;
  let dragStart = null;
  let selection = null;
  let working = false;

  // 数式・図・記号をAIが元画像から直接読めるように保持
  let selectedCropCanvas = null;
  let selectedCropDataUrl = '';

  let bubbleManual = false;
  let bubbleDragState = null;
  let bubbleResizeState = null;

  // API key は永続保存しない
  let openAIKey = '';
  let geminiKey = '';
  let geminiFreeKey = '';

  // Chrome内蔵AIは一度だけ作って使い回す
  let chromeAISession = null;
  let chromeAIInitPromise = null;

  let state = freshState();

  // タブを閉じるまで保持する全やりとり履歴
  let interactionLog = [];
  let selectionSession = 0;

  function freshState(){
    return {
      originalText:'',
      currentText:'',
      history:[],
      lastTransformAction:null
    };
  }

  function resetState(){
    state = freshState();
    bubbleText.textContent = '';
    selectedCropCanvas = null;
    selectedCropDataUrl = '';
  }

  function nowISO(){
    return new Date().toISOString();
  }

  function localTimeString(){
    const d=new Date();
    const pad=n=>String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  function currentModelLabel(){
    if(currentProvider()==='chromeai') return 'Gemini Nano (Chrome built-in)';
    return modelSelect?.value || '';
  }

  function logInteraction(kind, action, input, output, extra=''){
    interactionLog.push({
      session: selectionSession,
      time_iso: nowISO(),
      time_local: localTimeString(),
      kind,
      action: action || '',
      provider: providerName ? providerName() : '',
      provider_id: currentProvider ? currentProvider() : '',
      model: currentModelLabel(),
      input: input || '',
      output: output || '',
      original_text: state.originalText || '',
      extra: extra || ''
    });
    if(historyCount) historyCount.textContent=`履歴 ${interactionLog.length}件`;
  }

  function csvEscape(value){
    const s=String(value ?? '');
    return '"' + s.replace(/"/g,'""') + '"';
  }

  function downloadHistoryCSV(){
    if(!interactionLog.length){
      settingsState.textContent='まだ保存できる履歴がありません。';
      return;
    }

    const header=[
      'session',
      'time_local',
      'time_iso',
      'kind',
      'action',
      'provider',
      'provider_id',
      'model',
      'original_text',
      'input',
      'output',
      'extra'
    ];

    const rows=[header.map(csvEscape).join(',')];
    for(const r of interactionLog){
      rows.push([
        r.session,
        r.time_local,
        r.time_iso,
        r.kind,
        r.action,
        r.provider,
        r.provider_id,
        r.model,
        r.original_text,
        r.input,
        r.output,
        r.extra
      ].map(csvEscape).join(','));
    }

    // Excelで日本語が文字化けしにくいようBOM付きUTF-8
    const blob=new Blob(['\uFEFF'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const d=new Date();
    const pad=n=>String(n).padStart(2,'0');
    a.href=url;
    a.download=`kotoba_hiraku_history_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    settingsState.textContent=`履歴 ${interactionLog.length}件をCSVで保存しました。`;
  }

  function setButtonsDisabled(v){
    actionButtons.forEach(b => b.disabled = v);
  }

  function canvasPoint(ev){
    const r = canvas.getBoundingClientRect();
    return {
      x:(ev.clientX-r.left) * canvas.width / r.width,
      y:(ev.clientY-r.top) * canvas.height / r.height
    };
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(!baseImage) return;

    ctx.drawImage(baseImage,0,0,canvas.width,canvas.height);

    if(selection){
      const {x,y,w,h}=selection;
      ctx.save();
      ctx.fillStyle='rgba(0,0,0,.28)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.clearRect(x,y,w,h);
      ctx.drawImage(baseImage,x,y,w,h,x,y,w,h);
      ctx.strokeStyle='#fff';
      ctx.lineWidth=Math.max(2,canvas.width/800);
      ctx.setLineDash([12,8]);
      ctx.strokeRect(x,y,w,h);
      ctx.restore();
    }
  }

  async function captureScreen(){
    try{
      const captureOptions={
        video:{frameRate:1},
        audio:false
      };

      // 対応Chromeでは、共有対象のタブ／ウィンドウではなく
      // 「ことばをひらく」側にフォーカスを残す。
      let captureController=null;
      if('CaptureController' in window){
        try{
          captureController=new CaptureController();

          // Chromeの世代によって名称が異なるため両方に対応。
          try{
            captureController.setFocusBehavior('focus-capturing-application');
          }catch(_e1){
            try{
              captureController.setFocusBehavior('no-focus-change');
            }catch(_e2){}
          }

          captureOptions.controller=captureController;
        }catch(_e){
          captureController=null;
        }
      }

      const stream = await navigator.mediaDevices.getDisplayMedia(captureOptions);

      // ブラウザ実装がCaptureControllerを無視する場合の補助。
      // 共有選択ダイアログが閉じた直後に元アプリへフォーカスを要求する。
      try{ window.focus(); }catch(_e){}
      requestAnimationFrame(()=>{ try{ window.focus(); }catch(_e){} });
      setTimeout(()=>{ try{ window.focus(); }catch(_e){} },50);
      setTimeout(()=>{ try{ window.focus(); }catch(_e){} },180);

      const video=document.createElement('video');
      video.srcObject=stream;
      video.muted=true;
      await video.play();
      await new Promise(r=>setTimeout(r,250));

      const tmp=document.createElement('canvas');
      tmp.width=video.videoWidth;
      tmp.height=video.videoHeight;
      tmp.getContext('2d').drawImage(video,0,0);
      stream.getTracks().forEach(t=>t.stop());

      const img=new Image();
      img.onload=()=>{
        baseImage=img;
        canvas.width=img.width;
        canvas.height=img.height;
        selection=null;
        resetState();
        bubbleManual=false;
        bubble.style.removeProperty('left');
        bubble.style.removeProperty('top');
        bubble.style.removeProperty('width');
        bubble.style.removeProperty('height');
        bubble.classList.add('hidden');
        bubble.classList.remove('show');
                empty.classList.add('hidden');
        hint.classList.remove('hidden');
        draw();
      };
      img.src=tmp.toDataURL('image/png');
    }catch(e){
      console.error(e);
      alert('画面の取り込みがキャンセルされたか、ブラウザが対応していません。Chrome / Edgeでお試しください。');
    }
  }

  canvas.addEventListener('pointerdown',ev=>{
    if(!baseImage || working) return;
    dragging=true;
    dragStart=canvasPoint(ev);
    selection={x:dragStart.x,y:dragStart.y,w:0,h:0};
    bubble.classList.remove('show');

    canvas.setPointerCapture(ev.pointerId);
  });

  canvas.addEventListener('pointermove',ev=>{
    if(!dragging || !dragStart) return;
    const p=canvasPoint(ev);
    selection={
      x:Math.min(dragStart.x,p.x),
      y:Math.min(dragStart.y,p.y),
      w:Math.abs(p.x-dragStart.x),
      h:Math.abs(p.y-dragStart.y)

  canvas.addEventListener('pointerup',async ()=>{
    if(!dragging) return;
    dragging=false;
    if(!selection || selection.w<24 || selection.h<18){

    bubble.style.removeProperty('width');

  function makeCrop(){
    const {x,y,w,h}=selection;
    const crop=document.createElement('canvas');

    // 小さい文字のOCR精度を少し上げるため拡大
    const scale = Math.min(2, Math.max(1, 1400/Math.max(w,1)));
    crop.width=Math.max(1,Math.round(w*scale));
    crop.height=Math.max(1,Math.round(h*scale));
    const c=crop.getContext('2d');
    c.imageSmoothingEnabled=true;
    c.imageSmoothingQuality='high';
    c.drawImage(baseImage,x,y,w,h,0,0,crop.width,crop.height);
    return crop;
  }

  async function runOCR(){
    working=true;
    setButtonsDisabled(true);
    try{
      const crop=makeCrop();

      // OCR用画像を、そのままAIの視覚入力にも再利用する。
      // Tesseractが苦手な数式・分数・指数・根号・図中記号はAIが画像から読む。
      selectedCropCanvas = crop;
      selectedCropDataUrl = crop.toDataURL('image/png');

      const out=await Tesseract.recognize(crop,'jpn+eng');
      const text=(out.data.text||'')
        .replace(/[ \t]+\n/g,'\n')
        .replace(/\n{3,}/g,'\n\n')
        .trim();

      state.originalText=text;
      state.currentText=text;

      if(text){
        logInteraction('ocr','OCR','',text,'矩形領域をOCR');

        await replaceBubbleText(text);
      }else{
        await replaceBubbleText('文字をうまく読み取れませんでした。もう一度、文字の周りを少し広めに囲んでください。');
      }
    }catch(e){
      console.error(e);
      await replaceBubbleText('OCRに失敗しました。ネット接続を確認してください。');
    }finally{
      working=false;
      setButtonsDisabled(!state.originalText);
    }
  }

  function showBubbleLoading(message){
    bubble.classList.remove('hidden');

    requestAnimationFrame(()=>{
      bubble.classList.add('show');

  async function replaceBubbleText(text){
    bubbleText.classList.remove('swap-in');
    bubbleText.classList.add('swap-out');
    await wait(170);
    bubbleText.textContent=text;
    bubbleText.classList.remove('swap-out');

    bubbleText.classList.add('swap-in');
    await wait(340);
    bubbleText.classList.remove('swap-in');

  function wait(ms){return new Promise(r=>setTimeout(r,ms))}

  function selectionRectInWorkspace(){
    if(!selection) return null;
    const wr=workspace.getBoundingClientRect();
    const cr=canvas.getBoundingClientRect();
    const sx=cr.width/canvas.width;
    const sy=cr.height/canvas.height;
    return {
      left:(cr.left-wr.left)+selection.x*sx,
      top:(cr.top-wr.top)+selection.y*sy,
      width:selection.w*sx,
      height:selection.h*sy,
      right:(cr.left-wr.left)+(selection.x+selection.w)*sx,
      bottom:(cr.top-wr.top)+(selection.y+selection.h)*sy
    };
  }

  function clamp(n,min,max){
    return Math.max(min,Math.min(max,n));
  }

  function clampBubbleInsideWorkspace(){
    if(bubble.classList.contains('hidden')) return;
    const wr=workspace.getBoundingClientRect();
    const margin=8;
    const bw=bubble.offsetWidth;
    const bh=bubble.offsetHeight;
    const left=clamp(bubble.offsetLeft,margin,Math.max(margin,wr.width-bw-margin));
    const top=clamp(bubble.offsetTop,margin,Math.max(margin,wr.height-bh-margin));
    bubble.style.left=Math.round(left)+'px';
    bubble.style.top=Math.round(top)+'px';
  }

  function positionBubble(force=false){
    if(!selection) return;
    if(bubbleManual && !force){
      clampBubbleInsideWorkspace();
      updateBubbleShape();
      return;
    }

    const wr=workspace.getBoundingClientRect();
    const s=selectionRectInWorkspace();
    if(!s) return;

    const gap=24;
    const margin=14;
    const bw=bubble.offsetWidth || Math.min(430,wr.width-28);
    const bh=bubble.offsetHeight || Math.min(360,wr.height-28);

    let left=s.right+gap;
    let top=clamp(s.top,margin,Math.max(margin,wr.height-bh-margin));

    if(left+bw>wr.width-margin){
      left=s.left-bw-gap;
    }

    if(left<margin){
      left=clamp(s.left,margin,Math.max(margin,wr.width-bw-margin));
      top=s.bottom+gap;
      if(top+bh>wr.height-margin){
        top=Math.max(margin,s.top-bh-gap);
      }
    }

    bubble.style.left=Math.round(left)+'px';
    bubble.style.top=Math.round(top)+'px';
    clampBubbleInsideWorkspace();
    updateBubbleShape();
  }

  function updateBubbleShape(){
    if(!selection || bubble.classList.contains('hidden')) return;

    const s=selectionRectInWorkspace();
    if(!s) return;

    const bw=bubble.offsetWidth;
    const bh=bubble.offsetHeight;
    bubbleShapeLayer.setAttribute('viewBox',`0 0 ${bw} ${bh}`);

    const pad=1.5;
    const r=Math.min(24, bw/2-3, bh/2-3);

    const bcX=bw/2;
    const bcY=bh/2;
    const targetX=(s.left+s.width/2)-bubble.offsetLeft;
    const targetY=(s.top+s.height/2)-bubble.offsetTop;

    const dx=targetX-bcX;
    const dy=targetY-bcY;
    const len=Math.hypot(dx,dy);
    if(len<10) return;

    const ux=dx/len;
    const uy=dy/len;
    const halfW=Math.max(1,bw/2-pad);
    const halfH=Math.max(1,bh/2-pad);
    const tx=Math.abs(dx)>0.0001 ? halfW/Math.abs(dx) : Infinity;
    const ty=Math.abs(dy)>0.0001 ? halfH/Math.abs(dy) : Infinity;
    const t=Math.min(tx,ty);

    const baseX=bcX+dx*t;
    const baseY=bcY+dy*t;

    const tailLength=34;
    const halfBase=13;
    const tip={x:baseX+ux*tailLength,y:baseY+uy*tailLength};
    const p1={x:baseX-uy*halfBase,y:baseY+ux*halfBase};
    const p2={x:baseX+uy*halfBase,y:baseY-ux*halfBase};

    let side='right';
    const dLeft=Math.abs(baseX-pad);
    const dRight=Math.abs(baseX-(bw-pad));
    const dTop=Math.abs(baseY-pad);
    const dBottom=Math.abs(baseY-(bh-pad));
    const m=Math.min(dLeft,dRight,dTop,dBottom);
    if(m===dTop) side='top';
    else if(m===dBottom) side='bottom';
    else if(m===dLeft) side='left';
    else side='right';

    let a,b;
    if(side==='top' || side==='bottom'){
      a = p1.x <= p2.x ? p1 : p2;
      b = p1.x <= p2.x ? p2 : p1;
    }else{
      a = p1.y <= p2.y ? p1 : p2;
      b = p1.y <= p2.y ? p2 : p1;
    }

    const num=n=>Number(n).toFixed(1);
    const left=pad, right=bw-pad, top=pad, bottom=bh-pad;
    const path=[];

    const M=(x,y)=>path.push(`M ${num(x)} ${num(y)}`);
    const L=(x,y)=>path.push(`L ${num(x)} ${num(y)}`);
    const Q=(cx,cy,x,y)=>path.push(`Q ${num(cx)} ${num(cy)} ${num(x)} ${num(y)}`);

    M(left+r, top);

    if(side==='top'){
      L(Math.max(left+r, Math.min(a.x, right-r)), top);
      L(tip.x, tip.y);
      L(Math.max(left+r, Math.min(b.x, right-r)), top);
    }
    L(right-r, top);
    Q(right, top, right, top+r);

    if(side==='right'){
      L(right, Math.max(top+r, Math.min(a.y, bottom-r)));
      L(tip.x, tip.y);
      L(right, Math.max(top+r, Math.min(b.y, bottom-r)));
    }
    L(right, bottom-r);
    Q(right, bottom, right-r, bottom);

    if(side==='bottom'){
      L(Math.max(left+r, Math.min(b.x, right-r)), bottom);
      L(tip.x, tip.y);
      L(Math.max(left+r, Math.min(a.x, right-r)), bottom);
    }
    L(left+r, bottom);
    Q(left, bottom, left, bottom-r);

    if(side==='left'){
      L(left, Math.max(top+r, Math.min(b.y, bottom-r)));
      L(tip.x, tip.y);
      L(left, Math.max(top+r, Math.min(a.y, bottom-r)));
    }
    L(left, top+r);
    Q(left, top, left+r, top);
    path.push('Z');

    bubbleShapePath.setAttribute('d', path.join(' '));
  }

  function resetBubblePointerStates(){
    bubbleDragState=null;
    bubbleResizeState=null;
    bubble.classList.remove('dragging','resizing');
  }

  function startBubbleDrag(ev, captureEl){
    if(ev.button!==0) return;
    ev.preventDefault();
    bubbleManual=true;
    bubbleDragState={
      pointerId:ev.pointerId,
      startX:ev.clientX,
      startY:ev.clientY,
      left:bubble.offsetLeft,
      top:bubble.offsetTop,
      captureEl
    };
    bubble.classList.add('dragging');
    try{captureEl.setPointerCapture(ev.pointerId)}catch{}
  }

  function moveBubbleDrag(ev){
    if(!bubbleDragState || ev.pointerId!==bubbleDragState.pointerId) return;
    const wr=workspace.getBoundingClientRect();
    const margin=8;
    const nextLeft=bubbleDragState.left+(ev.clientX-bubbleDragState.startX);
    const nextTop=bubbleDragState.top+(ev.clientY-bubbleDragState.startY);
    bubble.style.left=Math.round(clamp(nextLeft,margin,Math.max(margin,wr.width-bubble.offsetWidth-margin)))+'px';
    bubble.style.top=Math.round(clamp(nextTop,margin,Math.max(margin,wr.height-bubble.offsetHeight-margin)))+'px';
    updateBubbleShape();
  }

  function endBubbleDrag(ev){
    if(!bubbleDragState || ev.pointerId!==bubbleDragState.pointerId) return;
    try{bubbleDragState.captureEl?.releasePointerCapture(ev.pointerId)}catch{}
    bubbleDragState=null;
    bubble.classList.remove('dragging');
    updateBubbleShape();
  }

  bubbleDragHandle.addEventListener('pointerdown',ev=>startBubbleDrag(ev,bubbleDragHandle));
  bubbleDragHandle.addEventListener('pointermove',moveBubbleDrag);
  bubbleDragHandle.addEventListener('pointerup',endBubbleDrag);
  bubbleDragHandle.addEventListener('pointercancel',resetBubblePointerStates);

  const bubbleToolbar=$('.bubble-toolbar');
  bubbleToolbar.addEventListener('pointerdown',ev=>{
    // ボタンそのものを押したときはAI操作。空白部分だけドラッグ移動。
    if(ev.target.closest('button')) return;
    startBubbleDrag(ev,bubbleToolbar);
  });
  bubbleToolbar.addEventListener('pointermove',moveBubbleDrag);
  bubbleToolbar.addEventListener('pointerup',endBubbleDrag);
  bubbleToolbar.addEventListener('pointercancel',resetBubblePointerStates);

  function startBubbleResize(ev, mode, captureEl){
    if(ev.button!==0) return;
    ev.preventDefault();
    ev.stopPropagation();
    bubbleManual=true;
    bubbleResizeState={
      pointerId:ev.pointerId,
      mode,
      captureEl,
      startX:ev.clientX,
      startY:ev.clientY,
      width:bubble.offsetWidth,
      height:bubble.offsetHeight
    };
    bubble.classList.add('resizing');
    try{captureEl.setPointerCapture(ev.pointerId)}catch{}
  }

  function moveBubbleResize(ev){
    if(!bubbleResizeState || ev.pointerId!==bubbleResizeState.pointerId) return;
    const wr=workspace.getBoundingClientRect();
    const margin=8;
    const maxW=Math.max(300,wr.width-bubble.offsetLeft-margin);
    const maxH=Math.max(190,wr.height-bubble.offsetTop-margin);

    let w=bubbleResizeState.width;
    let h=bubbleResizeState.height;

    if(bubbleResizeState.mode==='right' || bubbleResizeState.mode==='corner'){
      w=clamp(
        bubbleResizeState.width+(ev.clientX-bubbleResizeState.startX),
        300,maxW
      );
    }
    if(bubbleResizeState.mode==='bottom' || bubbleResizeState.mode==='corner'){
      h=clamp(
        bubbleResizeState.height+(ev.clientY-bubbleResizeState.startY),
        190,maxH
      );
    }

    bubble.style.width=Math.round(w)+'px';
    bubble.style.height=Math.round(h)+'px';
    updateBubbleShape();
  }

  function endBubbleResize(ev){
    if(!bubbleResizeState || ev.pointerId!==bubbleResizeState.pointerId) return;
    try{bubbleResizeState.captureEl?.releasePointerCapture(ev.pointerId)}catch{}
    bubbleResizeState=null;
    bubble.classList.remove('resizing');
    updateBubbleShape();
  }

  [
    [bubbleResizeRight,'right'],
    [bubbleResizeBottom,'bottom'],
    [bubbleResizeHandle,'corner']
  ].forEach(([el,mode])=>{
    el.addEventListener('pointerdown',ev=>startBubbleResize(ev,mode,el));
    el.addEventListener('pointermove',moveBubbleResize);
    el.addEventListener('pointerup',endBubbleResize);
    el.addEventListener('pointercancel',resetBubblePointerStates);
  });

  // OCRやAIの文章量で内部レイアウトが変わっても三角形を追従
  if('ResizeObserver' in window){
    const bubbleObserver=new ResizeObserver(()=>updateBubbleShape());
    bubbleObserver.observe(bubble);
  }

  window.addEventListener('resize',()=>{
    if(!bubble.classList.contains('hidden')){
      if(bubbleManual) clampBubbleInsideWorkspace();
      else positionBubble(true);
      updateBubbleShape();
    }
  });

  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g,c=>({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function actionName(action){
    return {
      explain:'ということは',
      analogy:'いいかえると',
      summary:'つまり',
      verify:'ほんとうに？',
      understood:'わかった',
      confused:'わからん'
    }[action]||action;
  }

  function promptFor(action){
    const original=state.originalText.trim();
    const current=state.currentText.trim();

    // 「わかった」「わからん」は説明方法そのものではないため除外して、
    // 直前の実質的な変換ボタンを探す。
    const transformActions=['explain','analogy','summary','verify'];
    const lastTransform=[...state.history].reverse().find(h=>transformActions.includes(h.action));
    const previousAction=lastTransform?.action || state.lastTransformAction || 'explain';
    const previousInput=lastTransform?.input || original;
    const previousOutput=lastTransform?.output || current;

    const base=`あなたは、文章を丁寧に説明する先生です。
読み手の知識量と語彙は、おおむね小学5年生までを前提にしてください。

大切なルール：

- 子ども扱いする話し方、幼児語、くだけすぎた言い方は使わない。
- 難しい専門語や抽象語はできるだけ避ける。
- 必要な専門語を使う場合は、その場で短く意味を説明する。
- 元の文章にない事実を勝手に追加しない。

- 「小学5年生向けに説明します」などの前置きは不要。
- Markdown、見出し、箇条書きは原則使わない。
- 吹き出しにそのまま表示できる、自然で簡潔な返答本文だけを書く。`;

    if(action==='understood'){
      return `${base}

これまでのやりとりのあと、読み手が
「わかった」
と伝えました。

【最初の文章】
${original}

【現在の説明】
${current}

【直前に行った説明方法】
${actionName(previousAction)}

この「わかった」への返答として、そのやりとりに合った短く丁寧な返事をしてください。

  function friendlyOpenAIError(res, data){
    const msg = data?.error?.message || '';
    const code = data?.error?.code || '';
    const type = data?.error?.type || '';

    if(
      code === 'credit_balance_exhausted' ||
      type === 'insufficient_quota' ||
      /no credits remaining|credit balance|insufficient quota/i.test(msg)
    ){
      const e = new Error(
        'OpenAI APIの残高がありません。ChatGPT Plus/Proとは別に、OpenAI PlatformのBillingでAPIクレジットが必要です。'
      );
      e.kind='billing';
      return e;
    }
    if(res.status===401){
      const e=new Error('OpenAI API Keyが認証されませんでした。キーを確認してください。');
      e.kind='auth'; return e;
    }
    if(res.status===429){
      const e=new Error('OpenAI APIから429が返りました。残高、利用上限、レート制限を確認してください。');
      e.kind='rate'; return e;
    }
    return new Error(msg || `OpenAI API: HTTP ${res.status}`);
  }

  function friendlyGeminiError(res,data){
    const msg =
      data?.error?.message ||
      data?.message ||
      '';

    if(res.status===400 && /api key|key/i.test(msg)){
      const e=new Error('Gemini API Keyが正しくないか、このGemini APIで使えないキーです。Google AI Studioで作成したキーを確認してください。');
      e.kind='auth'; return e;
    }
    if(res.status===401 || res.status===403){
      const e=new Error('Gemini APIへの認証または権限で拒否されました。Google AI StudioのAPI Keyとプロジェクト設定を確認してください。');
      e.kind='auth'; return e;
    }
    if(res.status===429){
      const e=new Error('Gemini APIの現在の利用上限に達しました。無料枠では時間または日単位の上限があり、上限を超えると429になります。');
      e.kind='rate'; return e;
    }
    return new Error(msg || `Gemini API: HTTP ${res.status}`);
  }

  async function getChromeAISession(onProgress){
    if(chromeAISession) return chromeAISession;
    if(chromeAIInitPromise) return chromeAIInitPromise;

    chromeAIInitPromise=(async()=>{
      const availability=await chromeAIAvailability();

      if(availability==='unavailable'){
        const e=new Error('このPCではChrome内蔵AIを利用できません。Gemini無料枠を選んでください。');
        e.kind='unsupported';
        throw e;
      }

      const opts={
        ...chromeAIOptions(),
        monitor(m){
          m.addEventListener('downloadprogress',e=>{
            if(onProgress) onProgress(Math.round((e.loaded||0)*100));
          });
        }
      };

      const session=await LanguageModel.create(opts);
      chromeAISession=session;
      return session;
    })();

    try{
      return await chromeAIInitPromise;
    }finally{
      chromeAIInitPromise=null;
    }
  }

  async function callChromeAI(action){
    const session=await getChromeAISession(p=>{
      if(working){
        bubbleText.innerHTML=
          `<span class="loading-row"><span class="spinner"></span>初回だけ無料AIを準備中… ${p}%</span>`;
      }
    });

    const promptText=promptWithVisualContext(action);

    // 数式を含む可能性があるので、矩形画像そのものをAIへ渡す。
    const multimodalPrompt = hasSelectionImage()
      ? [{
          role:'user',
          content:[
            {type:'text',value:promptText},
            {type:'image',value:selectedCropCanvas}
          ]
        }]
      : promptText;

    if(typeof session.promptStreaming==='function'){
      let full='';
      const stream=session.promptStreaming(multimodalPrompt);
      for await (const chunk of stream){
        full += String(chunk||'');
        bubbleText.textContent=full;
      }
      if(!full.trim()) throw new Error('Chrome内蔵AIから文章が返りませんでした。');
      return full.trim();
    }

    const text=await session.prompt(multimodalPrompt);
    if(!text || !String(text).trim()) throw new Error('Chrome内蔵AIから文章が返りませんでした。');
    return String(text).trim();
  }

    const raw=await res.text();
    let data;
    try{data=JSON.parse(raw)}catch{data={error:{message:raw}}}
    if(!res.ok) throw friendlyGeminiError(res,data);
    return extractGeminiText(data);
  }

  async function testAIConnection(){
    const p=currentProvider();
    if(p==='chromeai') return testChromeAIConnection();
    if(p==='gemini-free') return testGeminiFreeConnection();
    if(p==='gemini') return testGeminiConnection();
    return testOpenAIConnection();
  }

  async function callOpenAI(action){
    if(!openAIKey){
      openSettings('OpenAI API Keyを入力してください。');
      throw new Error('API Key未設定');
    }

    const body={
      model:modelSelect.value,
      reasoning:{effort:'low'},
      input: hasSelectionImage()
        ? [{
            role:'user',
            content:[
              {type:'input_text',text:promptWithVisualContext(action)},
              {type:'input_image',image_url:selectedCropDataUrl,detail:'high'}
            ]
          }]
        : promptWithVisualContext(action)
    };
    if(action==='verify') body.tools=[{type:'web_search'}];

    const res=await fetch('https://api.openai.com/v1/responses',{
      method:'POST',
      headers:{
        'Authorization':`Bearer ${openAIKey}`,
        'Content-Type':'application/json'
      },
      body:JSON.stringify(body)
    });

    const raw=await res.text();
    let data;
    try{data=JSON.parse(raw)}catch{data={error:{message:raw}}}
    if(!res.ok) throw friendlyOpenAIError(res,data);
    return extractOpenAIText(data);
  }

  async function geminiRequest(body){
    const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(modelSelect.value)}:generateContent`;
    const res=await fetch(url,{
      method:'POST',
      headers:{
        'x-goog-api-key':geminiKey,
        'Content-Type':'application/json'
      },
      body:JSON.stringify(body)
    });

    const raw=await res.text();
    let data;
    try{data=JSON.parse(raw)}catch{data={error:{message:raw}}}
    return {res,data};
  }

  async function callGemini(action){
    if(!geminiKey){
      openSettings('Gemini API Keyを入力してください。');
      throw new Error('API Key未設定');
    }

    const makeBody=(withSearch=false)=>{
      const body={
        contents:[{
          role:'user',
          parts:[
            {text:promptWithVisualContext(action)},
            ...(geminiImagePart() ? [geminiImagePart()] : [])
          ]
        }],
        generationConfig:{
          temperature: action==='verify' ? 0.1 : 0.35
        }
      };

      // Gemini無料枠ではGoogle Search groundingが使えないため、
      // 明示的にONにされた場合だけ検索を付ける。
      if(action==='verify' && withSearch){
        body.tools=[{google_search:{}}];
      }
      return body;
    };

    const wantSearch = action==='verify' && !!useSearchGrounding.checked;

    // まず指定どおり実行
    let {res,data}=await geminiRequest(makeBody(wantSearch));

    // Google検索付きで429になった場合は、
    // 検索なしの「原文との比較・知識による確認」に自動フォールバックする。
    if(wantSearch && res.status===429){
      console.warn('Gemini Google Search grounding returned 429. Retrying without search grounding.');
      ({res,data}=await geminiRequest(makeBody(false)));
    }

    if(!res.ok) throw friendlyGeminiError(res,data);
    return extractGeminiText(data);
  }

  async function callAI(action){
    const p=currentProvider();
    if(p==='chromeai') return callChromeAI(action);
    if(p==='gemini-free') return callGeminiFree(action);
    if(p==='gemini') return callGemini(action);
    return callOpenAI(action);
  }

  function extractOpenAIText(data){
    if(typeof data.output_text==='string' && data.output_text.trim()){
      return data.output_text.trim();
    }
    const out=[];
    for(const item of (data.output||[])){
      if(item.type==='message'){
        for(const c of (item.content||[])){
          if((c.type==='output_text'||c.type==='text') && c.text) out.push(c.text);
        }
      }
    }
    if(out.length) return out.join('\n').trim();
    throw new Error('OpenAIの返答本文を取得できませんでした。');
  }

  function extractGeminiText(data){
    const out=[];
    for(const candidate of (data.candidates||[])){
      for(const part of (candidate?.content?.parts||[])){
        if(typeof part?.text==='string' && part.text.trim()) out.push(part.text);
      }
    }
    if(out.length) return out.join('\n').trim();

    const reason=data?.candidates?.[0]?.finishReason;
    if(reason) throw new Error('Geminiから文章が返りませんでした。終了理由: '+reason);
    throw new Error('Geminiの返答本文を取得できませんでした。');
  }

  actionButtons.forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const action=btn.dataset.action;
      if(working || !state.currentText) return;

      const input=state.currentText;
      working=true;
      setButtonsDisabled(true);
      if(currentProvider()==='chromeai' && !chromeAISession){
        bubbleText.innerHTML=`<span class="loading-row"><span class="spinner"></span>初回だけ無料AIを準備しています…</span>`;
      }else{
        bubbleText.innerHTML=`<span class="loading-row"><span class="spinner"></span>${escapeHTML(actionName(action))}…</span>`;
      }

      try{
        const output=await callAI(action);
        state.currentText=output;
        state.history.push({
          action,
          input,
          output,
          time:Date.now(),
          provider:providerName(),
          model:currentModelLabel()
        });

        // 「わかった」「わからん」は説明命令ではないので、
        // 次の「わからん」で参照する直前命令を上書きしない。
        if(['explain','analogy','summary','verify'].includes(action)){
          state.lastTransformAction=action;
        }

        logInteraction('ai',actionName(action),input,output,'');

        // Chrome内蔵AIは生成中から逐次表示しているので、最後に重い差し替えをしない
        if(currentProvider()==='chromeai'){
          bubbleText.textContent=output;
          bubbleText.classList.remove('swap-out','swap-in');
        }else{
          await replaceBubbleText(output);
        }
      }catch(e){
        console.error(e);
        if(e.message!=='API Key未設定'){
          if(e.kind==='billing'){
            await replaceBubbleText('OpenAI API Keyは届いていますが、API残高がありません。\n\n⚙ 設定でGeminiに切り替えることもできます。');
          }else{
            const aiName=providerName();
            await replaceBubbleText(aiName+'を利用できませんでした。\n\n'+e.message);
          }
        }
      }finally{
        working=false;
        setButtonsDisabled(!state.originalText);
      }
    });
  });

  function openSettings(message=''){
    settingsState.textContent=message;
    modal.classList.remove('hidden');
    setTimeout(()=>apiKeyInput.focus(),50);
  }
  function closeSettingsModal(){
    modal.classList.add('hidden');
  }

  providerSelect.addEventListener('change',syncProviderUI);
  syncProviderUI();

  qrBtn.addEventListener('click',()=>{
    qrModal.classList.remove('hidden');
  });
  closeQr.addEventListener('click',()=>{
    qrModal.classList.add('hidden');
  });
  qrModal.addEventListener('click',ev=>{
    if(ev.target===qrModal) qrModal.classList.add('hidden');
  });

  settingsBtn.addEventListener('click',()=>openSettings());
  closeSettings.addEventListener('click',closeSettingsModal);
  modal.addEventListener('click',ev=>{
    if(ev.target===modal) closeSettingsModal();
  });
  document.addEventListener('keydown',ev=>{
    if(ev.key==='Escape'){
      if(!qrModal.classList.contains('hidden')){
        qrModal.classList.add('hidden');
      }else if(!modal.classList.contains('hidden')){
        closeSettingsModal();
      }
    }
  });

  toggleKey.addEventListener('click',()=>{
    const show=apiKeyInput.type==='password';
    apiKeyInput.type=show?'text':'password';
    toggleKey.textContent=show?'隠す':'表示';
  });

  saveSettings.addEventListener('click',async()=>{
    const p=currentProvider();
    const isChrome=p==='chromeai';
    const key=apiKeyInput.value.trim();

    if(!isChrome){
      if(key){
        setCurrentKey(key);
        apiKeyInput.value='';
        apiKeyInput.placeholder='設定済み（変更する場合だけ貼り付け）';
      }else if(!currentKey()){
        settingsState.textContent=providerName()+'のAPI Keyを貼り付けてください。';
        return;
      }
    }

    saveSettings.disabled=true;
    const aiName=providerName();
    settingsState.textContent=aiName+'を接続テスト中…';

    try{
      const reply=await testAIConnection();
      settingsState.innerHTML='<span class="status-dot ok"></span>'+aiName+' 接続成功：'+escapeHTML(reply || '接続OK');
      logInteraction('setting','AI設定','',aiName+' / '+currentModelLabel(),'接続テスト成功');
      setTimeout(closeSettingsModal,1000);
    }catch(e){
      console.error(e);
      if(e.kind==='billing'){
        settingsState.innerHTML=
          '<b>OpenAI APIの残高がありません。</b><br>'+
          '上のAIを「Chrome内蔵AI」または「Gemini無料枠」に切り替えると、無料で利用できます。';
      }else if(e.kind==='rate' && p==='gemini-free'){
        settingsState.innerHTML=
          '<b>Gemini無料枠の現在の上限に達しています。</b><br>'+
          '時間をおいて再試行するか、「Chrome内蔵AI」を選ぶとAPI上限なしで利用できます。';
      }else{
        settingsState.textContent='接続できません：'+(e.message||e);
      }
    }finally{
      saveSettings.disabled=false;
    }
  });

  if(downloadCsv){
    downloadCsv.addEventListener('click',downloadHistoryCSV);
  }

  window.addEventListener('beforeunload',()=>{
    try{chromeAISession?.destroy()}catch{}
  });

  captureBtn.addEventListener('click',captureScreen);

  // 初期canvas
  canvas.width=1280;
  canvas.height=720;
  draw();
})();
</script>
</body>
</html>
